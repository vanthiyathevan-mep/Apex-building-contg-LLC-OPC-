<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apex Construction ERP</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true">A</span><span>Apex ERP</span></div>
      <p class="muted" id="login-company">Construction management</p>
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </div>

  <div id="shell" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">A</span><span>Apex ERP</span></div>
      <nav id="nav" aria-label="Main"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost menu-btn" id="menu-btn" aria-label="Toggle menu" aria-controls="sidebar">☰</button>
        <div class="topbar-title" id="company-name"></div>
        <div class="topbar-user">
          <a href="#/account" id="user-chip" class="user-chip"></a>
          <button class="btn btn-ghost" id="logout-btn">Sign out</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="print-root" class="print-root" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
